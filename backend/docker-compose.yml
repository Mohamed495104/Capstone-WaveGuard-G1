# Docker Compose for Local Development and DigitalOcean Droplet Deployment
# Use this for local testing or manual deployment to DigitalOcean Droplets

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Add other environment variables from .env file or pass them directly
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      # Using node for health check since curl/wget not available in node:20-slim
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      # Optional: persist AI model cache
      - ai-models:/tmp/ai-models
    networks:
      - waveguard-network

networks:
  waveguard-network:
    driver: bridge

volumes:
  ai-models:
